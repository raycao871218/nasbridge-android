plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nas.dashboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nas.dashboard'
        minSdk 23
        targetSdk 34
        versionCode 27
        versionName '0.15.0'
        testInstrumentationRunner (project.hasProperty('presenceTests') ? 'com.nas.dashboard.PresenceInstrumentation' : project.hasProperty('smsTests') ? 'com.nas.dashboard.SmsInstrumentation' : project.hasProperty('videoTests') ? 'com.nas.dashboard.VideoInstrumentation' : 'com.nas.dashboard.RouterInstrumentation')
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

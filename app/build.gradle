plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nas.dashboard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nas.dashboard'
        minSdk 23
        targetSdk 34
        versionCode 34
        versionName '0.16.5'
        testInstrumentationRunner (project.hasProperty('taskTests') ? 'com.nas.dashboard.DailyTasksInstrumentation' : project.hasProperty('setupTests') ? 'com.nas.dashboard.SetupInstrumentation' : project.hasProperty('presenceTests') ? 'com.nas.dashboard.PresenceInstrumentation' : project.hasProperty('smsTests') ? 'com.nas.dashboard.SmsInstrumentation' : project.hasProperty('videoTests') ? 'com.nas.dashboard.VideoInstrumentation' : 'com.nas.dashboard.RouterInstrumentation')
    }

    buildTypes { debug { if (project.hasProperty('uiPreview')) applicationIdSuffix '.preview' } }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
